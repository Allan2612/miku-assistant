hotkey: "Ctrl+Alt+M"
language: "es"
window: { width: 420, height: 620, margin: 12, fps_visible: 30, monitor: 1, chat: false }  # monitor: 0 = main screen, 1, 2... from left to right; chat: a text box under Miku
behavior: { hide_after_seconds: 20, max_record_seconds: 10, silence_ms: 700, unload_after_minutes: 10, follow_up_seconds: 6 }  # follow_up: mic stays open after each answer, no "Hey Miku" (0 = off)
audio: { input_device: "" }  # a microphone's name ("" = Windows' default); chosen in the panel
llm: {
  model: "gemini-3.5-flash-lite",
  # Free tier, requests per minute / per day (24-oct). Each model has its own bucket, so when one runs out
  # Miku says "Un momento..." and tries the next. Gemma takes no audio: it gets Whisper's text
  # Gemma before the 20-a-day models (3-nov): one bad hour of 504s used up gemini-3-flash-preview's whole day
  models_fallback: [
    "gemini-3.1-flash-lite",   # 15 / 500
    "gemma-4-26b-a4b-it",      # 30 / 14400, slower (3-6 s)
    "gemini-3-flash-preview",  # 5 / 20
    "gemini-3.5-flash",        # 5 / 20
    "gemini-3.8-flash"         # 5 / 20
  ],
  max_history_turns: 10,
  temperature: 0.35,
  web_search: false  # Google search inside the single request: the free tier answers it with 429 (23-oct). Reading a web page (url_context) is always on
}
stt: { model: "small", device: "cpu", compute_type: "int8", cpu_threads: 8,
  # Names and songs you say often, so Whisper writes them right. Words only, never whole orders
  vocabulary: "Miku, Spotify, YouTube, Google, Opera GX, Discord, Steam, Bloc de notas, OBS, Visual Studio, K/DA, Firestarter, More, Los Tigres del Norte." }  # local, 0 requests: gates noise and feeds the fast path; Gemini hears the audio itself in its single request
# Miku's voice, chosen by ear on 27-oct (MikuDiva, higher and faster). scratch/voice_ab.py compares variations.
tts: { voice: "es-MX-DaliaNeural", rate: "+15%", pitch: "+30Hz" }
rvc: { enabled: true, model: "models/rvc/miku_diva.pth", index: "models/rvc/miku_diva.index", f0_up_key: 6, index_rate: 0.5 }
wakeword: { enabled: true, model: "models/wakeword/hey_miku.onnx", threshold: 0.2, patience: 1 }
live2d: { model: "models/miku_official/miku_sample_t04.model3.json", scale: 0 }
tools: { file_search_roots: ["~/Desktop", "~/Documents", "~/Downloads"], weather_city: "San José, Costa Rica" }  # city: "Ciudad, País"
apps: {
  opera: "opera.exe",
  "opera gx": "opera.exe",
  operagx: "opera.exe",
  navegador: "opera.exe",
  internet: "opera.exe",
  chrome: "chrome.exe",
  spotify: "spotify.exe",
  discord: "Discord"
}
log_level: "INFO"
# "modo <nombre>" runs these steps locally (0 Gemini requests). Any tool name + its args; destructive tools are skipped
routines: {
  trabajo: [
    { tool: "open_app", args: { app_name: "opera gx" } },
    { tool: "set_volume", args: { level: 30 } }
  ],
  musica: [
    { tool: "open_app", args: { app_name: "spotify" } },
    { tool: "set_volume", args: { level: 50 } }
  ]
}
