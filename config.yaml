hotkey: "Ctrl+Alt+M"
language: "es"
window: { width: 420, height: 620, anchor: "bottom-right", margin: 12, fps_visible: 30 }
behavior: { hide_after_seconds: 20, max_record_seconds: 10, silence_ms: 700, unload_after_minutes: 10 }
llm: {
  model: "gemini-3.5-flash-lite",
  models_fallback: ["gemini-3.5-flash", "gemini-flash-lite-latest"],  # 3.5-flash: only 20 requests/day on the free tier (counted as 3.6-flash); 3.7/3.8-flash time out, 23-oct
  max_history_turns: 10,
  temperature: 0.35,
  web_search: true  # Google search + reading web pages inside the single request; false if your quota suffers
}
stt: { model: "small", device: "cpu", compute_type: "int8", cpu_threads: 8 }  # local, 0 requests: gates noise and feeds the fast path; Gemini hears the audio itself in its single request
tts: { voice: "es-MX-DaliaNeural", rate: "+5%", pitch: "+10Hz" }
rvc: { enabled: true, model: "models/rvc/miku_mellow.pth", index: "models/rvc/miku_mellow.index", f0_up_key: 0, index_rate: 0.25 }
wakeword: { enabled: true, model: "models/wakeword/hey_miku.onnx", threshold: 0.35, patience: 1 }
live2d: { model: "models/miku_official/miku_sample_t04.model3.json", scale: 0, expressions: { happy: null, sad: null, surprised: null, angry: null, neutral: null } }
tools: { confirm_destructive: true, file_search_roots: ["~/Desktop", "~/Documents", "~/Downloads"] }
apps: {
  opera: "opera.exe",
  "opera gx": "opera.exe",
  operagx: "opera.exe",
  navegador: "opera.exe",
  internet: "opera.exe",
  chrome: "chrome.exe",
  spotify: "spotify.exe",
  discord: "Discord"
}
log_level: "INFO"
# "modo <nombre>" runs these steps locally (0 Gemini requests). Any tool name + its args; destructive tools are skipped
routines: {
  trabajo: [
    { tool: "open_app", args: { app_name: "opera gx" } },
    { tool: "set_volume", args: { level: 30 } }
  ],
  musica: [
    { tool: "open_app", args: { app_name: "spotify" } },
    { tool: "set_volume", args: { level: 50 } }
  ]
}
