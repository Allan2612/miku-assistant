<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miku Assistant</title>
    <link rel="stylesheet" href="/src/panel/panel.css" />
    <!-- Live2D Cubism Core: Miku on the Inicio page -->
    <script src="/lib/live2dcubismcore.min.js"></script>
    <script type="module" src="/src/panel/main.ts"></script>
  </head>
  <body>
    <div class="shell">
      <nav class="side" aria-label="Secciones del panel">
        <div class="brand">
          <div class="brand-bars" aria-hidden="true">
            <span style="height: 10px; background: #39c5bb"></span>
            <span style="height: 22px; background: #7ff3e8"></span>
            <span style="height: 15px; background: #39c5bb"></span>
            <span style="height: 8px; background: #ff5aaa"></span>
          </div>
          <div class="brand-name"><b>Miku Assistant</b><small>Panel de control</small></div>
        </div>
        <div id="nav" style="display: contents"></div>
        <div class="side-spacer"></div>
        <div class="side-status" aria-live="polite">
          <span id="side-dot" class="dot" aria-hidden="true"></span>
          <span id="side-text">Comprobando…</span>
        </div>
      </nav>
      <main id="view" class="view"></main>
    </div>
  </body>
